name: Probe Reactor Atlas (temporary)
on:
  push:
    branches: [data/nuclear-construction]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Units under construction in the states with gaps
        run: |
          ua='Mozilla/5.0 (compatible; anatomy-of-conflict-atlas; educational)'
          curl -sS -m 60 -A "$ua" https://reactoratlas.com/sitemaps/sitemap/plants.xml -o plants.xml
          grep -o '<loc>[^<]*</loc>' plants.xml | sed 's/<[^>]*>//g' | grep '/en/reactor/' | grep -E '/en/reactor/(canada|china|egypt|hungary|india|iran|south-korea|korea|pakistan|russia|uzbekistan)-' > urls.txt
          wc -l urls.txt
          python3 - <<'PY'
          import re, html, json, time, urllib.request
          clean = lambda x: re.sub(r'\s+', ' ', html.unescape(re.sub(r'<[^>]+>', ' ', x))).strip()
          out = []
          for u in open('urls.txt').read().split():
              time.sleep(2)
              try:
                  req = urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0 (compatible; anatomy-of-conflict-atlas; educational)'})
                  s = urllib.request.urlopen(req, timeout=60).read().decode('utf-8', 'replace')
              except Exception as e:
                  print('ERR', u, e); continue
              geo = re.findall(r'"(latitude|longitude)"\s*:\s*(-?[\d.]+)', s)
              title = clean((re.findall(r'<h1[^>]*>(.*?)</h1>', s, re.S) or [''])[0])
              rows = []
              for t in re.findall(r'<table.*?</table>', s, re.S):
                  trs = re.findall(r'<tr[^>]*>(.*?)</tr>', t, re.S)
                  if not trs: continue
                  head = [clean(c) for c in re.findall(r'<t[dh][^>]*>(.*?)</t[dh]>', trs[0], re.S)]
                  if 'Unit' not in head or 'Status' not in head: continue
                  for r in trs[1:]:
                      cells = [clean(c) for c in re.findall(r'<t[dh][^>]*>(.*?)</t[dh]>', r, re.S)]
                      d = dict(zip(head, cells))
                      if d.get('Status', '').startswith('Under construction'): rows.append(d)
              if rows: out.append({'url': u, 'title': title, 'geo': dict(geo[:2]), 'units': rows})
          print('PLANTS_WITH_UC', len(out))
          for p in out: print('JSON ' + json.dumps(p, ensure_ascii=False))
          PY
