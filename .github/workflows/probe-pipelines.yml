name: probe-pipelines
on:
  push:
    branches: [feat/pipelines]
    paths: ['.github/workflows/probe-pipelines.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: list bucket
        run: |
          for p in GOIT/ ggit/ latest/; do
            echo "== $p"; curl -sS --max-time 60 "https://publicgemdata.nyc3.digitaloceanspaces.com/?prefix=$p&max-keys=1000" | grep -oE '<Key>[^<]+</Key><LastModified>[^<]+</LastModified>[^<]*<ETag>[^<]*</ETag><Size>[0-9]+' | sed -E 's#<Key>([^<]+)</Key><LastModified>([^<]+)</LastModified>.*<Size>([0-9]+)#\2 \3 \1#' | grep -iE 'goit|ggit|pipe' | sort | tail -40 || true
          done
      - name: download
        run: |
          mkdir d && cd d
          curl -sS --max-time 300 -o ggit.geojson https://publicgemdata.nyc3.cdn.digitaloceanspaces.com/ggit/2026-03/ggit_map_2026-02-20.geojson
          curl -sS --max-time 300 -o goit.geojson https://publicgemdata.nyc3.cdn.digitaloceanspaces.com/GOIT/2025-03/goit_2025-04-09.geojson
          ls -la
      - name: inspect
        run: |
          python3 - <<'PY'
          import json, collections
          for f in ['d/ggit.geojson','d/goit.geojson']:
              print('#####', f)
              g = json.load(open(f))
              feats = g['features']
              print('features', len(feats), 'top keys', [k for k in g if k!='features'])
              gt = collections.Counter(x['geometry']['type'] if x.get('geometry') else None for x in feats)
              print('geom types', gt)
              keys = collections.Counter(k for x in feats for k in x['properties'])
              print('prop keys', dict(keys))
              for k in ['status','status-legend','tracker-custom','tracker','Fuel','fuel','units-of-m','tracker-display','region']:
                  if k in keys:
                      print(k, collections.Counter(str(x['properties'].get(k)) for x in feats).most_common(25))
              lines = [x for x in feats if x.get('geometry') and 'Line' in x['geometry']['type']]
              print('line feats', len(lines))
              def npts(geom):
                  c = geom['coordinates']
                  return len(c) if geom['type']=='LineString' else sum(len(p) for p in c)
              print('total pts', sum(npts(x['geometry']) for x in lines))
              for x in lines[:3]:
                  print(json.dumps(x['properties'], ensure_ascii=False)[:1500])
              # status of lines
              print('line status', collections.Counter(str(x['properties'].get('status')) for x in lines).most_common(20))
              # sample of famous
              for nm in ['Nord Stream','TurkStream','Power of Siberia','Druzhba','Kirkuk','East-West','Habshan','Baku','Trans Adriatic','Dolphin','Arab Gas','Keystone']:
                  hits = [x['properties'] for x in feats if nm.lower() in str(x['properties'].get('name','')).lower()]
                  print('--', nm, len(hits), [ (h.get('name'), h.get('unit-name') or h.get('segment'), h.get('status'), h.get('capacity') or h.get('capacity-table')) for h in hits[:6]])
          PY
      - name: licence text
        run: |
          for u in https://globalenergymonitor.org/projects/global-gas-infrastructure-tracker/download-data/ https://globalenergymonitor.org/projects/global-oil-infrastructure-tracker/download-data/ https://globalenergymonitor.org/creative-commons/; do
            echo "== $u"; curl -sSL --max-time 60 -A 'Mozilla/5.0' "$u" | python3 -c "import sys,re,html; t=sys.stdin.read(); t=re.sub(r'<script.*?</script>|<style.*?</style>','',t,flags=re.S); t=html.unescape(re.sub(r'<[^>]+>',' ',t)); t=re.sub(r'\s+',' ',t); [print('…',t[max(0,m.start()-300):m.end()+400]) for m in list(re.finditer(r'(?i)creative commons|CC BY|license|licence', t))[:4]]" || true
          done
