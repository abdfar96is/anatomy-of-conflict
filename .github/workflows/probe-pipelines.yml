name: probe-pipelines
on:
  push:
    branches: [feat/pipelines]
    paths: ['.github/workflows/probe-pipelines.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: OGIM record on Zenodo (metadata only)
        run: |
          python3 - <<'PY'
          import json, urllib.request
          r = json.load(urllib.request.urlopen('https://zenodo.org/api/records/13259749', timeout=60))
          print('title', r['metadata']['title']); print('version', r['metadata'].get('version')); print('date', r['metadata'].get('publication_date'))
          print('license', r['metadata'].get('license')); print('latest', r.get('links', {}).get('latest'))
          for f in r.get('files', []): print('file', f['key'], f['size'])
          try:
              l = json.load(urllib.request.urlopen(r['links']['latest'], timeout=60))
              print('LATEST', l['metadata']['title'], l['metadata'].get('version'), l['metadata'].get('publication_date'), l['metadata'].get('license'))
              for f in l.get('files', []): print('file', f['key'], f['size'])
              print(l['metadata'].get('description', '')[:2500])
          except Exception as e: print('latest failed', e)
          PY
