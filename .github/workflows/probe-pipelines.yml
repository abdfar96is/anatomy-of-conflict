name: probe-pipelines
on:
  push:
    branches: [feat/pipelines]
    paths: ['.github/workflows/probe-pipelines.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: read source articles
        run: |
          cat > urls.txt <<'U'
          https://boereport.com/2026/04/02/israels-leviathan-gas-field-to-resume-operations-after-war-shutdown-energy-ministry-says/
          https://www.ecofinagency.com/news/0404-54411-egypt-s-sumed-pipeline-flows-jump-150-as-iran-related-conflict-shifts-oil-routes
          https://www.kpler.com/es/blog/factbox-red-sea-crude-flows-bab-el-mandeb-and-alternative-routes
          https://www.sumed.org/?p=history
          https://www.africanews.com/2025/12/12/sudan-rsf-capture-of-heglig-threatens-south-sudans-oil-exports/
          https://www.radiotamazuj.org/en/news/article/1710-sudanese-soldiers-enter-south-sudan-after-losing-heglig-oilfield-to-rsf
          https://www.irrawaddy.com/opinion/analysis/militarized-pipelines-how-chinas-security-priorities-harm-local-communities.html
          https://idsa.in/?p=43773
          U
          python3 - <<'PY'
          import re, html, subprocess
          KEY = re.compile(r'(?i)pipeline|barrel|bpd|b/d|halt|resum|capacity|bcm|cubic|million|transit|export|attack|drone|strike|yanbu|fujairah|ceyhan|heglig|leviathan|kyaukphyu|sokhna|kerir|kunming|myanmar|rsf')
          for u in [l.strip() for l in open('urls.txt') if l.strip()]:
              r = subprocess.run(['curl', '-sSL', '--max-time', '40', '-w', '\n%{http_code}', u], capture_output=True, text=True)
              body, _, code = r.stdout.rpartition('\n')
              t = re.sub(r'(?is)<(script|style|noscript|svg|nav|footer|header)\b.*?</\1>', ' ', body)
              m = re.search(r'(?is)<title>(.*?)</title>', body)
              t = html.unescape(re.sub(r'<[^>]+>', ' ', t)); t = re.sub(r'\s+', ' ', t)
              dates = sorted(set(re.findall(r'"datePublished"\s*:\s*"([^"]+)"', body)))[:2]
              print('\n#####', code, u); print('title:', html.unescape(m.group(1).strip()) if m else '', '| published:', dates)
              sents = re.split(r'(?<=[.!?])\s+', t)
              seen = 0
              for s in sents:
                  if 40 < len(s) < 600 and KEY.search(s) and seen < 22:
                      print(' -', s); seen += 1
          PY
