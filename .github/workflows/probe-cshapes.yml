name: Probe CShapes (temporary)
on:
  push:
    branches: [feat/historical-borders]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: TopoJSON attributes
        run: |
          set +e
          curl -sS -m 300 -L -o pkg.tgz https://cran.r-project.org/src/contrib/cshapes_2.0.tar.gz && tar xzf pkg.tgz
          xz -dk cshapes/inst/extdata/cshapes_2_gw.topojson.xz && ls -la cshapes/inst/extdata/
          sed -n 1,60p cshapes/R/cshp.R
          python3 - <<'PY'
          import json, collections
          t = json.load(open('cshapes/inst/extdata/cshapes_2_gw.topojson'))
          print('OBJECTS', list(t['objects']), 'transform', t.get('transform'), 'arcs', len(t['arcs']))
          for name, o in t['objects'].items():
              g = o['geometries']; print('OBJ', name, len(g))
              keys = collections.Counter(k for x in g for k in (x.get('properties') or {}))
              print('KEYS', dict(keys))
              for x in g[:3]: print('ROW', json.dumps(x.get('properties'), ensure_ascii=False))
              for k in keys:
                  vals = collections.Counter(str((x.get('properties') or {}).get(k)) for x in g)
                  print('VAL', k, len(vals), vals.most_common(14))
              owners = collections.Counter((x['properties'].get('owner'), x['properties'].get('status')) for x in g)
              print('OWNERxSTATUS', owners.most_common(40))
          PY
