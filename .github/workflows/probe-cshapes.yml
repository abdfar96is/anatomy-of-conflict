name: Probe CShapes (temporary)
on:
  push:
    branches: [feat/historical-borders]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: R package data files
        run: |
          set +e
          curl -sS -m 300 -L -o pkg.tgz -w "pkg %{http_code} %{size_download}\n" https://cran.r-project.org/src/contrib/cshapes_2.0.tar.gz
          tar tzf pkg.tgz | head -40
          tar xzf pkg.tgz
          ls -la cshapes/inst/extdata cshapes/data 2>/dev/null
          grep -rn "status\|owner\|ruledby" cshapes/R/*.R | head -20
          for f in $(find cshapes -name "*.gpkg" -o -name "*.sqlite"); do echo "GPKG $f"; python3 - "$f" <<'PY'
          import sqlite3, sys
          c = sqlite3.connect(sys.argv[1])
          for (t,) in c.execute("select name from sqlite_master where type='table'"): 
              cols = [r[1] for r in c.execute(f'pragma table_info("{t}")')]
              n = c.execute(f'select count(*) from "{t}"').fetchone()[0]
              print('TABLE', t, n, cols)
          PY
          done
