name: Probe CShapes (temporary)
on:
  push:
    branches: [feat/historical-borders]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/historical-borders
      - name: Simplify CShapes 2.0 (GW) from the cshapes R package
        run: |
          curl -sS -m 300 -L -o /tmp/pkg.tgz https://cran.r-project.org/src/contrib/cshapes_2.0.tar.gz
          tar xzf /tmp/pkg.tgz -C /tmp && xz -dk /tmp/cshapes/inst/extdata/cshapes_2_gw.topojson.xz
          mkdir -p public/data/history
          npx -y mapshaper@0.6.102 -i /tmp/cshapes/inst/extdata/cshapes_2_gw.topojson \
            -simplify 4% keep-shapes \
            -filter-fields gwcode,country_name,start,end,status,owner,capname,caplong,caplat,b_def,fid \
            -rename-layers borders \
            -o public/data/history/cshapes.topo.json format=topojson quantization=100000
          ls -la public/data/history/; gzip -c public/data/history/cshapes.topo.json | wc -c
      - name: Commit the simplified file to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/history/cshapes.topo.json
          git commit -m "data: simplified CShapes 2.0 (GW) borders, 1886-2019 (CC BY-NC-SA 4.0)"
          git push origin HEAD:feat/historical-borders
