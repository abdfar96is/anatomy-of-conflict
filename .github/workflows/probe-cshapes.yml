name: Probe CShapes (temporary)
on:
  push:
    branches: [feat/historical-borders]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: CSV and shapefile attributes, simplification size
        run: |
          set +e
          ua='Mozilla/5.0 (compatible; anatomy-of-conflict-atlas; educational)'
          curl -sS -m 300 -L -A "$ua" -o cs.csv -w "csv %{http_code} %{size_download}\n" https://icr.ethz.ch/data/cshapes/CShapes-2.0.csv
          echo "CSVHEAD"; head -c 1500 cs.csv | cut -c1-600; echo
          python3 - <<'PY'
          import csv, collections, sys
          csv.field_size_limit(sys.maxsize)
          raw = open('cs.csv', encoding='utf-8', errors='replace').read()
          delim = '\t' if raw.count('\t') > raw.count(',') else ','
          rows = list(csv.DictReader(raw.splitlines(), delimiter=delim))
          print('CSVROWS', len(rows), 'COLS', list(rows[0].keys()))
          for k in rows[0]:
              if 'geom' in k.lower(): continue
              vals = collections.Counter(r[k] for r in rows)
              print('COL', k, len(vals), list(vals.items())[:10])
          PY
          curl -sS -m 300 -L -A "$ua" -o cs.zip -w "zip %{http_code} %{size_download}\n" https://icr.ethz.ch/data/cshapes/CShapes-2.0.zip
          unzip -l cs.zip | head -20
          unzip -o -q cs.zip -d shp
          python3 - <<'PY'
          import glob, struct
          for f in glob.glob('shp/**/*.dbf', recursive=True):
              b = open(f, 'rb').read(32 + 32 * 40)
              n = (struct.unpack('<H', b[8:10])[0] - 33) // 32
              print('DBF', f, [b[32 + i*32: 32 + i*32 + 11].split(b'\0')[0].decode() for i in range(n)])
          PY
          curl -sS -m 300 -L -A "$ua" -o cs.geojson https://icr.ethz.ch/data/cshapes/CShapes-2.0.geojson
          for pct in 2 5; do npx -y mapshaper@0.6.102 cs.geojson -simplify ${pct}% keep-shapes -o format=topojson quantization=100000 out$pct.json 2>&1 | tail -2; ls -la out$pct.json; gzip -c out$pct.json | wc -c; done
