name: Probe PRIS (temporary)
on:
  push:
    branches: [feat/nuclear-plants]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Reactor Atlas year tables and terms
        run: |
          set +e
          ua='Mozilla/5.0 (compatible; anatomy-of-conflict-atlas; educational)'
          for u in https://reactoratlas.com/en/year/2024 https://reactoratlas.com/en/year/2025 https://reactoratlas.com/en/year/2026 https://reactoratlas.com/en/about https://reactoratlas.com/en/terms https://reactoratlas.com/en/sources https://reactoratlas.com/en/methodology; do
            f=$(echo "$u" | md5sum | cut -c1-8).html
            curl -sS -m 60 -L -A "$ua" -o "$f" -w "== $u %{http_code} %{size_download}\n" "$u"
            sleep 2
            python3 - "$f" <<'PY'
          import re, sys, html
          s = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          clean = lambda x: re.sub(r'\s+', ' ', html.unescape(re.sub(r'<[^>]+>', ' ', x))).strip()
          for h, t in re.findall(r'(<h[23][^>]*>.*?</h[23]>)?\s*(?:<div[^>]*>\s*)*(<table.*?</table>)', s, re.S):
              print('  ## table', clean(h) if h else '')
              for r in re.findall(r'<tr[^>]*>(.*?)</tr>', t, re.S):
                  print('    |', ' | '.join(clean(c) for c in re.findall(r'<t[dh][^>]*>(.*?)</t[dh]>', r, re.S)))
          if not re.search(r'<table', s):
              body = clean(re.sub(r'<script.*?</script>|<style.*?</style>', ' ', s, flags=re.S))
              i = max(0, body.lower().find('licen'))
              print('  text', body[:600]); print('  licence-ctx', body[i:i+700] if 'licen' in body.lower() else '-')
          PY
          done
