name: Probe PRIS (temporary)
on:
  push:
    branches: [feat/nuclear-plants]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Reactor databases
        run: |
          set +e
          ua='Mozilla/5.0 (compatible; anatomy-of-conflict-atlas; educational)'
          for u in \
            "https://world-nuclear.org/nuclear-reactor-database/summary" \
            "https://world-nuclear.org/nuclear-reactor-database/details/ZAPOROZHYE-1" \
            "https://reactoratlas.com/en/year/2025" \
            "https://reactoratlas.com/robots.txt" \
            "https://world-nuclear.org/robots.txt" \
            "https://pris-stats.iaea.org/" ; do
            f=$(echo "$u" | md5sum | cut -c1-8).html
            curl -sS -m 60 -L -A "$ua" -o "$f" -w "== $u %{http_code} %{size_download} %{content_type}\n" "$u"
            python3 - "$f" <<'PY'
          import re, sys, html
          s = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          print('  tables', len(re.findall(r'<table', s)), 'json-ish', len(re.findall(r'__NEXT_DATA__|application/json|\.json', s)))
          for m in re.findall(r'(https?://[^"\' ]*(?:api|json|graphql|export|csv)[^"\' ]*)', s)[:12]: print('  url', m[:160])
          for m in re.findall(r'<script[^>]+src="([^"]+)"', s)[:6]: print('  script', m[:120])
          text = html.unescape(re.sub(r'<[^>]+>', ' ', re.sub(r'<script.*?</script>|<style.*?</style>', ' ', s, flags=re.S)))
          text = re.sub(r'\s+', ' ', text)
          print('  text', text[:900])
          PY
          done
