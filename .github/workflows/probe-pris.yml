name: Probe PRIS (temporary)
on:
  push:
    branches: [feat/nuclear-plants]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: PRIS country and reactor pages
        run: |
          set +e
          ua='anatomy-of-conflict-atlas (educational; data refresh)'
          curl -sS -m 60 -A "$ua" -I "https://pris.iaea.org/PRIS/CountryStatistics/CountryDetails.aspx?current=BE" | grep -i "^location\|^HTTP"
          curl -sS -m 60 -L -c jar -b jar -A "$ua" -o be.html -w "BE country %{http_code} %{size_download} %{url_effective}\n" "https://pris.iaea.org/PRIS/CountryStatistics/CountryDetails.aspx?current=BE"
          curl -sS -m 60 -A "$ua" -L -c jar -b jar -o r.html -w "reactor 50 %{http_code} %{size_download} %{url_effective}\n" "https://pris.iaea.org/PRIS/CountryStatistics/ReactorDetails.aspx?current=50"
          curl -sS -m 60 -A "$ua" -L -c jar -b jar -o ws.html -w "world %{http_code} %{size_download} %{url_effective}\n" "https://pris.iaea.org/PRIS/WorldStatistics/OperationalReactorsByCountry.aspx"
          python3 - <<'PY'
          import re, html
          for f in ['be.html', 'r.html', 'ws.html']:
              try: s = open(f, encoding='utf-8', errors='replace').read()
              except Exception as e: print(f, e); continue
              print('=====', f, len(s))
              tables = re.findall(r'<table[^>]*>.*?</table>', s, re.S)
              print('tables', len(tables))
              for t in tables[:4]:
                  rows = re.findall(r'<tr[^>]*>(.*?)</tr>', t, re.S)
                  print('-- table rows', len(rows))
                  for r in rows[:6]:
                      cells = [html.unescape(re.sub(r'<[^>]+>', '', c)).strip() for c in re.findall(r'<t[dh][^>]*>(.*?)</t[dh]>', r, re.S)]
                      links = re.findall(r'href="([^"]*current=\d+[^"]*)"', r)
                      print('   ', cells[:12], links[:1])
              spans = re.findall(r'<span id="(MainContent_[^"]+)"[^>]*>(.*?)</span>', s, re.S)
              for k, v in spans[:40]: print('  span', k, '=', html.unescape(re.sub(r'<[^>]+>', '', v)).strip()[:80])
          PY
