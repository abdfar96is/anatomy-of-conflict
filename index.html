<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>تشريح الصراع</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="description" content="أطلس تفاعلي يربط الجغرافيا بالعرق والدين والنزاعات والموارد والتحالفات — Anatomy of Conflict">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap">
<script>
  // Set language direction and theme before first paint so nothing flips after load.
  (function () {
    var p = {};
    try { p = JSON.parse(localStorage.getItem('atlas-v2-prefs') || '{}'); } catch (e) {}
    var lang = p.lang === 'en' ? 'en' : 'ar';
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    if (p.theme === 'dark' || p.theme === 'light') document.documentElement.dataset.theme = p.theme;
  })();
</script>
</head>
<body>
<div id="root"></div>

<div id="loader" role="status">
  <svg class="mark" width="56" height="56" viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
    <circle cx="28" cy="28" r="25"/><circle cx="28" cy="28" r="17" stroke-dasharray="2 4"/>
    <path d="M28 3v50M3 28h50"/><path d="M36 20l-5 11-11 5 5-11z" fill="currentColor" stroke="none"/>
  </svg>
  <h1 id="loader-title">تشريح الصراع</h1>
  <div class="bar"><i id="loader-bar"></i></div>
  <p id="loader-msg">جارٍ تحميل الأطلس…</p>
</div>

<script type="module" src="/src/main.tsx"></script>
</body>
</html>
